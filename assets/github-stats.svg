<svg xmlns="http://www.w3.org/2000/svg" width="380" height="200"
     viewBox="0 0 380 200" role="img" aria-label="yuzhiquan&#x27;s GitHub stats">
  <title>yuzhiquan&#x27;s GitHub stats</title>
  <style>
    .card  { fill: #ffffff; stroke: #d0d7de; }
    .title { fill: #1f2328; font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .label { fill: #656d76; font: 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .value { fill: #1f2328; font: 600 17px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .name  { fill: #1f2328; font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .pct   { fill: #656d76; font: 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .track { fill: #eaeef2; }
    .q0 { fill: #ebedf0; } .q1 { fill: #9be9a8; }
    .q2 { fill: #40c463; } .q3 { fill: #30a14e; } .q4 { fill: #216e39; }
    .axis  { fill: #656d76; font: 10px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .frame { fill: none; stroke: #d0d7de; }
    @media (prefers-color-scheme: dark) {
      .card  { fill: #0d1117; stroke: #30363d; }
      .title, .value, .name { fill: #e6edf3; }
      .label, .pct, .axis { fill: #8b949e; }
      .track { fill: #21262d; }
      .q0 { fill: #161b22; } .q1 { fill: #0e4429; }
      .q2 { fill: #006d32; } .q3 { fill: #26a641; } .q4 { fill: #39d353; }
      .frame { stroke: #30363d; }
    }
  </style>
  <rect class="card" x="0.5" y="0.5" width="379" height="199" rx="10"/>
  <rect x="18" y="30" width="7" height="7" rx="2" fill="#f78166"/>  <text class="label" x="32" y="38">Total Commits</text>  <text class="value" x="18" y="60">5,387</text>  <rect x="192" y="30" width="7" height="7" rx="2" fill="#a371f7"/>  <text class="label" x="206" y="38">Total Pull Requests</text>  <text class="value" x="192" y="60">103</text>  <rect x="18" y="84" width="7" height="7" rx="2" fill="#3fb950"/>  <text class="label" x="32" y="92">Contributions (1y)</text>  <text class="value" x="18" y="114">271</text>  <rect x="192" y="84" width="7" height="7" rx="2" fill="#58a6ff"/>  <text class="label" x="206" y="92">Public Repositories</text>  <text class="value" x="192" y="114">117</text>  <rect x="18" y="138" width="7" height="7" rx="2" fill="#e3b341"/>  <text class="label" x="32" y="146">Total Stars Earned</text>  <text class="value" x="18" y="168">4</text>  <rect x="192" y="138" width="7" height="7" rx="2" fill="#db61a2"/>  <text class="label" x="206" y="146">Followers</text>  <text class="value" x="192" y="168">92</text></svg>
